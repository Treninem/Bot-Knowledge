name: T522 original humor exact-head (read-only)
on:
  pull_request:
    paths:
      - "staging/ru/optional_humor_t522_context_pool.json"
      - "scripts/test_optional_humor_t522.py"
      - "docs/OPTIONAL_HUMOR_T522_2026_11_09.md"
      - ".github/workflows/t522-humor.yml"
      - "packs/ru/optional_humor_qa.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/optional_humor_t522_context_pool.json"
      - "scripts/test_optional_humor_t522.py"
      - ".github/workflows/t522-humor.yml"
permissions:
  contents: read
jobs:
  verify-t522:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checkout exact head
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source, scope, counts and cross-stage dedup
        run: python -m unittest scripts.test_optional_humor_t522 -v
