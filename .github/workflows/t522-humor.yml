name: T522 staged opt-in humor exact-head read-only
on:
  pull_request:
    paths:
      - "staging/ru/optional_humor_t522_context_pool.json"
      - "scripts/test_optional_humor_t522.py"
      - ".github/workflows/t522-humor.yml"
      - "packs/ru/optional_humor_qa.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/optional_humor_t522_context_pool.json"
      - "scripts/test_optional_humor_t522.py"
      - ".github/workflows/t522-humor.yml"
permissions:
  contents: read
jobs:
  exact-head-t522:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert actual checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registered pack and staged lineages
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_optional_humor_t517 scripts.test_optional_humor_t518 scripts.test_optional_humor_t519 scripts.test_optional_humor_t520 scripts.test_optional_humor_t521 scripts.test_optional_humor_t522 -q
