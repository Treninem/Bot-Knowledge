name: Firm de-escalation RU stage QA
on:
  pull_request:
    paths:
      - 'staging/ru/firm_deescalation_20261111_context_pool.json'
      - 'scripts/test_firm_deescalation_20261111.py'
      - '.github/workflows/firm-deescalation-20261111.yml'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact PR head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered packs and firm replies
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_firm_deescalation_20261111 -v
