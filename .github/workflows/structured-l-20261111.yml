name: Structured RU L 60 replies exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_l.json'
      - 'scripts/test_structured_l_20261111.py'
      - 'staging/ru/structured_information_20261112_delta_m.json'
      - 'scripts/test_structured_m_20261112.py'
      - 'docs/STRUCTURED_M_2026_11_12.md'
      - 'docs/STRUCTURED_L_2026_11_11.md'
      - '.github/workflows/structured-l-20261111.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checkout SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources and L/M
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_l_20261111 -v
          python -m unittest scripts.test_structured_m_20261112 -v
