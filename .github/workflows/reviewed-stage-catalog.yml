name: Verified staged catalog T369/T370 read-only exact-head
on:
  pull_request:
    paths:
      - 'scripts/reviewed_stage_catalog.py'
      - 'scripts/test_reviewed_stage_catalog.py'
      - 'docs/REVIEWED_STAGE_CATALOG_T369_T370_2026_11_07.md'
      - '.github/workflows/reviewed-stage-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reviewed_stage_catalog.py'
      - 'scripts/test_reviewed_stage_catalog.py'
      - 'docs/REVIEWED_STAGE_CATALOG_T369_T370_2026_11_07.md'
      - '.github/workflows/reviewed-stage-catalog.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published manifest and source SHA-256
        run: python scripts/validate_pack.py
      - name: Test verified catalog and fail-closed routing
        run: python -m unittest scripts.test_reviewed_stage_catalog -q
