name: Conversation followthrough 82 intents
on:
  pull_request:
    paths:
      - "packs/ru/conversation_followthrough_qa.json"
      - "manifest.json"
      - "scripts/test_conversation_followthrough_20261116.py"
      - ".github/workflows/conversation-followthrough-20261116.yml"
  push:
    branches: [main]
    paths:
      - "packs/ru/conversation_followthrough_qa.json"
      - "manifest.json"
      - "scripts/test_conversation_followthrough_20261116.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered data
        run: |
          python scripts/validate_pack.py
          python scripts/test_conversation_followthrough_20261116.py
          python -O scripts/test_conversation_followthrough_20261116.py
