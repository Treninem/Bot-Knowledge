name: ImPULS verified help QA
on:
  pull_request:
    paths:
      - 'packs/ru/impuls_verified_boundaries_qa.json'
      - 'manifest.json'
      - 'scripts/test_impuls_verified_boundaries_20261111.py'
      - '.github/workflows/impuls-verified-help-20261111.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify schema, SHA and duplicates
        run: |
          python scripts/validate_pack.py
          python scripts/validate_qa_v1.py
          python -m unittest scripts.test_impuls_verified_boundaries_20261111 -v
