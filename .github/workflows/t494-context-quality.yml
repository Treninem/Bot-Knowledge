name: T494 group contexts (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/group_turns_t494_context_pool.json'
      - 'scripts/test_group_turns_t494.py'
      - '.github/workflows/t494-context-quality.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/group_turns_t494_context_pool.json'
      - 'scripts/test_group_turns_t494.py'
      - '.github/workflows/t494-context-quality.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check precise checkout HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test T494 SHA, full history, contexts and dedup
        run: python -m unittest scripts.test_group_turns_t494 -q
