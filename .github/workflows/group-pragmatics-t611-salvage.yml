name: Salvaged group dialogue alternatives (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/group_pragmatics_t611_alternatives_review_only.json'
      - 'scripts/test_group_pragmatics_t611_salvage.py'
      - 'docs/GROUP_PRAGMATICS_T611_SALVAGE_2026_11_11.md'
      - '.github/workflows/group-pragmatics-t611-salvage.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/group_pragmatics_t611_alternatives_review_only.json'
      - 'scripts/test_group_pragmatics_t611_salvage.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "BK_T611_RESCUE_EXACT_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 500 archived alternatives and collision guards
        run: python -m unittest scripts.test_group_pragmatics_t611_salvage -v
