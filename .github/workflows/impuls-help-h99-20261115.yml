name: ImPULS H99 exact-head contextual QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h99_20261115.json'
      - 'scripts/test_impuls_help_h99_20261115.py'
      - 'docs/IMPULS_HELP_H99_2026_11_15.md'
      - '.github/workflows/impuls-help-h99-20261115.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check full staged lineage without registration
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h98_20261115.py
          python -O -B scripts/test_impuls_help_h98_20261115.py
          python -B scripts/test_impuls_help_h99_20261115.py
          python -O -B scripts/test_impuls_help_h99_20261115.py
      - name: Show exact staged SHA
        run: sha256sum staging/ru/impuls_help_context_h99_20261115.json
