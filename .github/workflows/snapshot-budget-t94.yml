name: Consumer snapshot budget T94 exact-head

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snapshot-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "BK_SNAPSHOT_BUDGET_HEAD=$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact snapshot-byte budget boundaries
        run: python -B scripts/test_consumer_snapshot_budget.py
      - name: Validate registered packs, SHA-256 and snapshot budget
        run: python -B scripts/validate_pack.py
