name: T496 social clarity (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/social_clarity_t496_context_pool.json'
      - 'scripts/test_social_clarity_t496.py'
      - '.github/workflows/t496-context-quality.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/social_clarity_t496_context_pool.json'
      - 'scripts/test_social_clarity_t496.py'
      - '.github/workflows/t496-context-quality.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check checkout HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate T496 history, source, audience and context
        run: python -m unittest scripts.test_social_clarity_t496 -q
