name: Bot-Knowledge T509 contextual precision continuation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-t509:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered source and T507-T509 candidates
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_precision_t507 scripts.test_precision_t508 scripts.test_precision_t509 scripts.test_precision_t510_t511 -v
