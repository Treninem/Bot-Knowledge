name: Community FAQ synthetic checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all SHA-pinned packs
        run: python scripts/validate_pack.py
      - name: Ten scoped synthetic community FAQ scenarios and cache invalidation
        run: python scripts/test_community_faq.py
