name: ImPULS H90 actual-head candidate QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h90_20261115.json'
      - 'scripts/test_impuls_help_h90_20261115.py'
      - 'docs/IMPULS_HELP_H90_2026_11_15.md'
      - '.github/workflows/impuls-help-h90-20261115.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actual PR head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate registered snapshot and H90 candidates
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h89_20261115.py
          python -O -B scripts/test_impuls_help_h89_20261115.py
          python -B scripts/test_impuls_help_h90_20261115.py
          python -O -B scripts/test_impuls_help_h90_20261115.py
          sha256sum staging/ru/impuls_help_context_h90_20261115.json
