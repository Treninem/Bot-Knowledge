name: Bot-Knowledge T503 practical language stages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  t503-practical-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD=$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Registered pack validation
        run: python scripts/validate_pack.py
      - name: T503 candidate tests
        run: python -m unittest scripts.test_practical_turns_t503 -q
