name: T325 T326 diverse scoped RU contexts exact-head
on:
  pull_request:
    paths:
      - 'staging/ru/colloquial_t325_context_pool.json'
      - 'staging/ru/practical_t326_context_pool.json'
      - 'scripts/context_t325_t326.py'
      - 'scripts/test_context_t325_t326.py'
      - 'docs/CONTEXT_CONTINUATION_T325_T326_2026_11_07.md'
      - '.github/workflows/context-t325-t326.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/colloquial_t325_context_pool.json'
      - 'staging/ru/practical_t326_context_pool.json'
      - 'scripts/context_t325_t326.py'
      - 'scripts/test_context_t325_t326.py'
      - 'docs/CONTEXT_CONTINUATION_T325_T326_2026_11_07.md'
      - '.github/workflows/context-t325-t326.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered SHA
        run: python scripts/validate_pack.py
      - name: Full T325 T326 scope and prior SHA
        run: python -m unittest scripts.test_context_t325_t326 -q
      - name: Validate read-only pools
        run: python -m scripts.context_t325_t326
