name: T283 contextual read-only inventory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-t283:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered packs
        run: python scripts/validate_pack.py
      - name: Verify full T283 parent chain and safeguards
        run: python -m unittest scripts.test_context_overlay_t283 -q
