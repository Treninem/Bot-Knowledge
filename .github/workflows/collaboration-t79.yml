name: Collaboration QA T79
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate packs and manifest checksums
        run: python scripts/validate_pack.py
      - name: Check T79 distinct intents and QA keys
        run: |
          python -m unittest scripts.test_collaboration_qa_t79 -q
          python -m unittest scripts.test_collaboration_qa_t83 -q
