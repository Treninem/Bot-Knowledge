name: T526 cumulative creative mini-story integrity exact-head
on:
  pull_request:
    paths:
      - "staging/ru/creative_microstories_t526_context_pool.json"
      - "scripts/test_creative_microstories_t526.py"
      - "docs/CREATIVE_MICROSTORIES_T526_2026_11_10.md"
      - ".github/workflows/t526-creative-microstories.yml"
      - "packs/ru/social_dialogues.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/creative_microstories_t526_context_pool.json"
      - "scripts/test_creative_microstories_t526.py"
      - ".github/workflows/t526-creative-microstories.yml"
permissions:
  contents: read
jobs:
  verify-t526:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert actual exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source manifest and 340 unique staged stories
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_creative_microstories_t524 scripts.test_creative_microstories_t525 scripts.test_creative_microstories_t526 -v
