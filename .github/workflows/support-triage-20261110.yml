name: Support triage RU staging (exact-head)
on:
  pull_request:
    paths:
      - staging/ru/support_triage_20261110_context_pool.json
      - scripts/test_support_triage_20261110.py
      - .github/workflows/support-triage-20261110.yml
  push:
    branches: [main]
    paths:
      - staging/ru/support_triage_20261110_context_pool.json
      - scripts/test_support_triage_20261110.py
      - .github/workflows/support-triage-20261110.yml
permissions:
  contents: read
jobs:
  verify-support-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'BK_SUPPORT_TRIAGE_CHECKOUT_SHA=%s\\n' "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate RU scoped responses, provenance, privacy and dedup
        run: python -m unittest scripts.test_support_triage_20261110 -v
