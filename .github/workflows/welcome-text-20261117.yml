name: Newcomer welcome pool exact-head
on:
  pull_request:
    paths:
      - 'staging/ru/newcomer_welcome_20261117_context_pool.json'
      - 'scripts/test_welcome_text_20261117.py'
      - 'docs/WELCOME_TEXT_2026_11_17.md'
      - '.github/workflows/welcome-text-20261117.yml'
permissions:
  contents: read
jobs:
  newcomer-welcome-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual checkout is the exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
      - name: Validate registered snapshot without changing it
        run: python scripts/validate_pack.py
      - name: Validate both 100-answer contextual pools
        run: python -m unittest scripts.test_welcome_text_20261117 -v
