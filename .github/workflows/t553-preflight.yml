name: T553 preflight read-only exact-head
on:
  pull_request:
    paths:
      - "scripts/followthrough_stage_catalog.py"
      - "scripts/test_followthrough_stage_preflight.py"
      - ".github/workflows/t553-preflight.yml"
      - "docs/STAGE_PREFLIGHT_T553_2026_11_10.md"
  push:
    branches: [main]
    paths:
      - "scripts/followthrough_stage_catalog.py"
      - "scripts/test_followthrough_stage_preflight.py"
      - ".github/workflows/t553-preflight.yml"
permissions:
  contents: read
jobs:
  stage-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test fail-closed historical stage pin preflight
        run: |
          python -m unittest scripts.test_followthrough_stage_preflight -v
          python -m unittest scripts.test_followthrough_stage_catalog -q
