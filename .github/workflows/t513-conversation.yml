name: Bot-Knowledge T513 conversation continuation
on:
  pull_request:
    paths:
      - 'staging/ru/conversation_t513_context_pool.json'
      - 'staging/ru/conversation_t512_context_pool.json'
      - 'scripts/test_conversation_t513.py'
      - '.github/workflows/t513-conversation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check actual head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate T513 staged candidate continuity
        run: python scripts/test_conversation_t513.py
