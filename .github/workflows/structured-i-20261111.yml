name: Structured RU I 120 read-only exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_i.json'
      - 'scripts/test_structured_i_20261111.py'
      - 'docs/STRUCTURED_I_2026_11_11.md'
      - '.github/workflows/structured-i-20261111.yml'
      - 'staging/ru/structured_information_20261111_delta_l.json'
      - 'scripts/test_structured_l_20261111.py'
      - 'docs/STRUCTURED_L_2026_11_11.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual checkout matches requested PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate packs and structured-language stages
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_remainder_20261111 scripts.test_structured_followup_20261111 scripts.test_structured_gh_20261111 scripts.test_structured_i_20261111 scripts.test_structured_l_20261111 -v
