name: T288 context overlay read-only
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-t288:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered pack hashes and schema
        run: python scripts/validate_pack.py
      - name: Verify T288 full parent chain and opt-in guards
        run: python -m unittest scripts.test_context_overlay_t288 -q
