name: T593-T594 interpersonal continuation exact-head
on:
  pull_request:
    paths:
      - "staging/ru/interpersonal_t593_context_delta.json"
      - "staging/ru/interpersonal_t594_context_delta.json"
      - "scripts/test_interpersonal_t593_t594.py"
      - ".github/workflows/t593-interpersonal-continuation.yml"
  push:
    branches: [main]
    paths:
      - "staging/ru/interpersonal_t593_context_delta.json"
      - "staging/ru/interpersonal_t594_context_delta.json"
      - "scripts/test_interpersonal_t593_t594.py"
      - ".github/workflows/t593-interpersonal-continuation.yml"
permissions:
  contents: read
jobs:
  verify-t593-t594:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and all interpersonal reply stages
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_interpersonal_t590_t591 scripts.test_interpersonal_t592 scripts.test_interpersonal_t593_t594 -v
