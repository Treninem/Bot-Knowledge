name: Bot-Knowledge T516 seven complete staged conversation intents
on:
  pull_request:
    paths:
      - 'staging/ru/conversation_t516_context_pool.json'
      - 'scripts/test_conversation_t516.py'
      - 'docs/CONVERSATION_T516_2026_11_09.md'
      - '.github/workflows/t516-conversation.yml'
      - 'packs/ru/dialogue.json'
      - 'manifest.json'
permissions:
  contents: read
jobs:
  t516:
    runs-on: ubuntu-latest
    steps:
      - name: Exact head checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert actual checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate staged 700 reply lineage
        run: python scripts/test_conversation_t516.py
