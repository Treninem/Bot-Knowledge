name: T520 humor continuation exact-head read-only
on:
  pull_request:
    paths:
      - "staging/ru/optional_humor_t520_context_pool.json"
      - "scripts/test_optional_humor_t520.py"
      - ".github/workflows/t520-humor.yml"
      - "packs/ru/optional_humor_qa.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/optional_humor_t520_context_pool.json"
      - "scripts/test_optional_humor_t520.py"
      - ".github/workflows/t520-humor.yml"
permissions:
  contents: read
jobs:
  exact-head-t520:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checkout source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify T517 through T520 inventories and mandatory opt-in
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_optional_humor_t517 scripts.test_optional_humor_t518 scripts.test_optional_humor_t519 scripts.test_optional_humor_t520 -q
