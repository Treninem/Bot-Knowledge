name: English pragmatic T78 exact-head
on:
  pull_request:
    paths:
      - 'packs/ru/english_pragmatics_qa.json'
      - 'manifest.json'
      - 'scripts/test_english_pragmatics_t78.py'
      - '.github/workflows/english-t78.yml'
permissions:
  contents: read
jobs:
  english-t78:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate versioned packages
        run: python scripts/validate_pack.py
      - name: Check original English nuance and retrieval
        run: python -m scripts.test_english_pragmatics_t78
