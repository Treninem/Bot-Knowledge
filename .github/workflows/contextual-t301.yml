name: T301 Russian contextual recovery completion
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-t301:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published packs and source manifest
        run: python scripts/validate_pack.py
      - name: Check 116 new replies, completion and all historical stages
        run: python -m unittest scripts.test_context_overlay_t301 -q
