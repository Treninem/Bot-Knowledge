name: Support triage contextual continuation C-D
on:
  pull_request:
    paths:
      - 'staging/ru/support_triage_20261110_context_*.json'
      - 'scripts/test_support_triage_continuation_20261110.py'
      - 'docs/SUPPORT_TRIAGE_CONTINUATION_2026_11_10.md'
      - '.github/workflows/support-triage-continuation-20261110.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/support_triage_20261110_context_*.json'
      - 'scripts/test_support_triage_continuation_20261110.py'
      - '.github/workflows/support-triage-continuation-20261110.yml'
permissions:
  contents: read
jobs:
  verify-triage-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the actual PR head (never the synthetic merge ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Identify exact checkout head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Python read-only data validation
        run: python -m unittest scripts.test_support_triage_20261110 scripts.test_support_triage_continuation_20261110
