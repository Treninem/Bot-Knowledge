name: ImPULS H96 exact-head staged QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h96_20261115.json'
      - 'scripts/test_impuls_help_h96_20261115.py'
      - 'docs/IMPULS_HELP_H96_2026_11_15.md'
      - '.github/workflows/impuls-help-h96-20261115.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest and H96 corpus
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h95_20261115.py
          python -O -B scripts/test_impuls_help_h95_20261115.py
          python -B scripts/test_impuls_help_h96_20261115.py
          python -O -B scripts/test_impuls_help_h96_20261115.py
          python -B scripts/test_impuls_help_h93_preview.py
          python -O -B scripts/test_impuls_help_h93_preview.py
      - name: Show source hashes
        run: sha256sum staging/ru/impuls_help_context_h95_20261115.json staging/ru/impuls_help_context_h96_20261115.json
