name: Structured information RU remainder C-D exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_c.json'
      - 'staging/ru/structured_information_20261111_delta_d.json'
      - 'scripts/test_structured_remainder_20261111.py'
      - '.github/workflows/structured-remainder-20261111.yml'
      - 'docs/STRUCTURED_REMAINDER_2026_11_11.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact pull request HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered packs and independent C/D additions
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_remainder_20261111 -v
