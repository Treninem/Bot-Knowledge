name: T299 scoped Russian reply verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-t299:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Registered pack schema and manifest checksum
        run: python scripts/validate_pack.py
      - name: Full T299 history and 98 new scoped replies
        run: python -m unittest scripts.test_context_overlay_t299 -q
