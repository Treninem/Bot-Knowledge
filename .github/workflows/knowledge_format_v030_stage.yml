name: Knowledge format v030 scoped stage exact-head
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout head exactly
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registered pack and staged delta
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_knowledge_format_v030_stage -q
          python -O -m unittest scripts.test_knowledge_format_v030_stage -q
