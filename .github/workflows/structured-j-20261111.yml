name: Structured RU J 108 original contextual answers exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_j.json'
      - 'scripts/test_structured_j_20261111.py'
      - 'docs/STRUCTURED_J_2026_11_11.md'
      - '.github/workflows/structured-j-20261111.yml'
      - 'staging/ru/structured_information_20261111_delta_k.json'
      - 'scripts/test_structured_k_20261111.py'
      - 'docs/STRUCTURED_K_2026_11_11.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source packs and all staged structured context
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_remainder_20261111 scripts.test_structured_followup_20261111 scripts.test_structured_gh_20261111 scripts.test_structured_j_20261111 scripts.test_structured_k_20261111 -v
