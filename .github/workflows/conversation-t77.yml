name: Conversation precision T77 exact-head
on:
  pull_request:
    paths:
      - 'packs/ru/conversation_precision_qa.json'
      - 'manifest.json'
      - 'scripts/test_conversation_precision_t77.py'
      - '.github/workflows/conversation-t77.yml'
permissions:
  contents: read
jobs:
  precision-t77:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify all pack SHA and contracts
        run: python scripts/validate_pack.py
      - name: Test T77 new contexts and local search
        run: python -m scripts.test_conversation_precision_t77
