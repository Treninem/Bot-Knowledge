name: ImPULS H104 exact-head staged QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h104_20261116.json'
      - 'scripts/test_impuls_help_h104_20261116.py'
      - 'docs/IMPULS_HELP_H104_2026_11_16.md'
      - '.github/workflows/impuls-help-h104-20261116.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual checkout against current PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify H104 full lineage, uniqueness and privacy
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/validate_qa_v1.py
          python -B scripts/test_impuls_help_h103_20261116.py
          python -O -B scripts/test_impuls_help_h103_20261116.py
          python -B scripts/test_impuls_help_h104_20261116.py
          python -O -B scripts/test_impuls_help_h104_20261116.py
      - name: Report actual stage checksum
        run: sha256sum staging/ru/impuls_help_context_h104_20261116.json
