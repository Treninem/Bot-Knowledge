name: Structured information RU context supplement QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_a.json'
      - 'staging/ru/structured_information_20261111_delta_b.json'
      - 'scripts/test_structured_context_20261111.py'
      - '.github/workflows/structured-context-20261111.yml'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact pull request head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered packs and supplemental contexts
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_context_20261111 -v
