name: T586-T589 complete contextual social intent sets
on:
  pull_request:
    paths:
      - "staging/ru/social_boundaries_t586_context_delta.json"
      - "staging/ru/social_boundaries_t587_context_delta.json"
      - "staging/ru/social_boundaries_t588_context_delta.json"
      - "staging/ru/social_boundaries_t589_context_delta.json"
      - "scripts/test_social_boundaries_t586_t589.py"
      - ".github/workflows/t586-social-completion.yml"
  push:
    branches: [main]
    paths:
      - "staging/ru/social_boundaries_t586_context_delta.json"
      - "staging/ru/social_boundaries_t587_context_delta.json"
      - "staging/ru/social_boundaries_t588_context_delta.json"
      - "staging/ru/social_boundaries_t589_context_delta.json"
      - "scripts/test_social_boundaries_t586_t589.py"
      - ".github/workflows/t586-social-completion.yml"
permissions:
  contents: read
jobs:
  verify-t586-t589:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout is the exact intended SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registered source and all ten stages
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_social_boundaries_t580 scripts.test_social_boundaries_t581 scripts.test_social_boundaries_t582_t583 scripts.test_social_boundaries_t584_t585 scripts.test_social_boundaries_t586_t589 -v
