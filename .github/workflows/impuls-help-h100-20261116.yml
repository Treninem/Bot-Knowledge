name: ImPULS H100 exact-head contextual QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h100_20261116.json'
      - 'scripts/test_impuls_help_h100_20261116.py'
      - 'docs/IMPULS_HELP_H100_2026_11_16.md'
      - '.github/workflows/impuls-help-h100-20261116.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staged lineage without registration
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h99_20261115.py
          python -O -B scripts/test_impuls_help_h99_20261115.py
          python -B scripts/test_impuls_help_h100_20261116.py
          python -O -B scripts/test_impuls_help_h100_20261116.py
      - name: Hash new JSON bytes
        run: sha256sum staging/ru/impuls_help_context_h100_20261116.json
