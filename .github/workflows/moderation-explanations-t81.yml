name: Moderation explanation QA T81
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  explain-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact checkout
        run: git rev-parse HEAD
      - name: Validate every manifest pack
        run: python scripts/validate_pack.py
      - name: Test language-only moderation scenarios
        run: python -m unittest scripts.test_moderation_explanations_t81 -q
