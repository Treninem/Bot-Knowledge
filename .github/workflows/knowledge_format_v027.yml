name: Knowledge format v027 exact-head validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest, qa.v1 and consumer budget
        run: python scripts/validate_pack.py
      - name: Validate context cases remained unchanged semantically
        run: |
          python scripts/test_context_cases.py
          python -m scripts.test_context_t73
      - name: Check eighty new replies, SHA and constraints
        run: |
          python -m unittest scripts.test_knowledge_format_v027 -q
          python -O -m unittest scripts.test_knowledge_format_v027 -q
