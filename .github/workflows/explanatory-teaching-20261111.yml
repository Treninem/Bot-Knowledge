name: RU explanatory teaching read-only staged QA
on:
  pull_request:
    paths:
      - 'staging/ru/explanatory_teaching_20261111_*'
      - 'scripts/test_explanatory_teaching_20261111.py'
      - 'docs/EXPLANATORY_TEACHING_2026_11_11.md'
      - '.github/workflows/explanatory-teaching-20261111.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/explanatory_teaching_20261111_*'
      - 'scripts/test_explanatory_teaching_20261111.py'
      - 'docs/EXPLANATORY_TEACHING_2026_11_11.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "BK_TEACH_EXACT_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify explanatory teaching candidates
        run: python -m unittest scripts.test_explanatory_teaching_20261111 -v
