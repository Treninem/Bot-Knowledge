name: T298 scoped Russian context replies
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-t298:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out exact head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published manifest and packs
        run: python scripts/validate_pack.py
      - name: Validate complete T298 historical chain and new responses
        run: python -m unittest scripts.test_context_overlay_t298 -q
