name: Structured RU K contextual replies exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_k.json'
      - 'staging/ru/structured_information_20261113_delta_k2.json'
      - 'staging/ru/structured_information_20261113_delta_k3.json'
      - 'staging/ru/structured_information_20261113_delta_k4.json'
      - 'staging/ru/structured_information_20261113_delta_k5.json'
      - 'staging/ru/structured_information_20261113_delta_k6.json'
      - 'staging/ru/structured_information_20261113_delta_k7.json'
      - 'staging/ru/structured_information_20261113_delta_k8.json'
      - 'staging/ru/structured_information_20261113_delta_k9.json'
      - 'scripts/test_structured_k_20261111.py'
      - 'scripts/test_structured_k2_20261113.py'
      - 'scripts/test_structured_k3_20261113.py'
      - 'scripts/test_structured_k4_20261113.py'
      - 'scripts/test_structured_k5_20261113.py'
      - 'scripts/test_structured_k6_20261113.py'
      - 'scripts/test_structured_k7_20261113.py'
      - 'scripts/test_structured_k8_20261113.py'
      - 'scripts/test_structured_k9_20261113.py'
      - 'docs/STRUCTURED_K_2026_11_11.md'
      - 'docs/STRUCTURED_K2_2026_11_13.md'
      - 'docs/STRUCTURED_K3_2026_11_13.md'
      - 'docs/STRUCTURED_K4_2026_11_13.md'
      - 'docs/STRUCTURED_K5_2026_11_13.md'
      - 'docs/STRUCTURED_K6_2026_11_13.md'
      - 'docs/STRUCTURED_K7_2026_11_13.md'
      - 'docs/STRUCTURED_K8_2026_11_13.md'
      - 'docs/STRUCTURED_K9_2026_11_13.md'
      - '.github/workflows/structured-k-20261111.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual checkout equals PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all registered packs and structured K
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_k_20261111 scripts.test_structured_k2_20261113 scripts.test_structured_k3_20261113 scripts.test_structured_k4_20261113 scripts.test_structured_k5_20261113 scripts.test_structured_k6_20261113 scripts.test_structured_k7_20261113 scripts.test_structured_k8_20261113 scripts.test_structured_k9_20261113 -v
          python -O -m unittest scripts.test_structured_k5_20261113 scripts.test_structured_k6_20261113 scripts.test_structured_k7_20261113 scripts.test_structured_k8_20261113 -v
          sha256sum staging/ru/structured_information_20261113_delta_k5.json staging/ru/structured_information_20261113_delta_k6.json staging/ru/structured_information_20261113_delta_k7.json staging/ru/structured_information_20261113_delta_k8.json staging/ru/structured_information_20261113_delta_k9.json
