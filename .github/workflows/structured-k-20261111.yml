permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual checkout equals PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all registered packs and structured K
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_k_20261111 scripts.test_structured_k2_20261113 scripts.test_structured_k3_20261113 scripts.test_structured_k4_20261113 scripts.test_structured_k5_20261113 scripts.test_structured_k6_20261113 scripts.test_structured_k7_20261113 scripts.test_structured_k8_20261113 scripts.test_structured_k9_20261113 scripts.test_structured_k10_20261113 scripts.test_structured_k11_20261113 scripts.test_structured_k12_20261113 scripts.test_structured_k13_20261113 scripts.test_structured_k14_20261114 scripts.test_structured_k15_20261114 scripts.test_structured_k16_20261114 scripts.test_structured_k17_20261114 scripts.test_structured_k18_20261114 scripts.test_structured_k19_20261114 -v
