name: T500 three completed group context pools (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/group_turns_t500_context_pool.json'
      - 'scripts/test_group_turns_t500.py'
      - '.github/workflows/t500-context-quality.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/group_turns_t500_context_pool.json'
      - 'scripts/test_group_turns_t500.py'
      - '.github/workflows/t500-context-quality.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm actual exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check T500 source SHA, parent Git blob, privacy and full-history distinctness
        run: python -m unittest scripts.test_group_turns_t500 -q
