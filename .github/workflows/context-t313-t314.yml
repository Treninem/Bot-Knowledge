name: T313 T314 contextual replies exact-head
on:
  pull_request:
    paths:
      - 'staging/ru/colloquial_t313_context_pool.json'
      - 'staging/ru/practical_t314_context_pool.json'
      - 'scripts/context_t313_t314.py'
      - 'scripts/test_context_t313_t314.py'
      - 'docs/CONTEXT_CONTINUATION_T313_T314_2026_11_07.md'
      - '.github/workflows/context-t313-t314.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/colloquial_t313_context_pool.json'
      - 'staging/ru/practical_t314_context_pool.json'
      - 'scripts/context_t313_t314.py'
      - 'scripts/test_context_t313_t314.py'
      - 'docs/CONTEXT_CONTINUATION_T313_T314_2026_11_07.md'
      - '.github/workflows/context-t313-t314.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert actual head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify registered manifest
        run: python scripts/validate_pack.py
      - name: Verify 92 entries and parent integrity
        run: python -m unittest scripts.test_context_t313_t314 -q
      - name: Validate unregistered selection
        run: python -m scripts.context_t313_t314
