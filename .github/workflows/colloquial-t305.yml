name: T305 contextual colloquial RU (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/colloquial_t305_context_pool.json'
      - 'scripts/colloquial_t305.py'
      - 'scripts/test_colloquial_t305.py'
      - '.github/workflows/colloquial-t305.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/colloquial_t305_context_pool.json'
      - 'scripts/colloquial_t305.py'
      - 'scripts/test_colloquial_t305.py'
      - '.github/workflows/colloquial-t305.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate manifest SHA and bounds
        run: python scripts/validate_pack.py
      - name: Validate T305 context, provenance and selections
        run: python -m unittest scripts.test_colloquial_t305 -q
