name: Bot-Knowledge T512 contextual conversation candidates
on:
  pull_request:
    paths:
      - 'staging/ru/conversation_t512_context_pool.json'
      - 'scripts/test_conversation_t512.py'
      - 'docs/CONVERSATION_T512_2026_11_09.md'
      - '.github/workflows/t512-conversation.yml'
      - 'packs/ru/dialogue.json'
      - 'manifest.json'
permissions:
  contents: read
jobs:
  t512:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head without credential persistence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert actual checkout SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Test source hashes and T512 staged data
        run: python scripts/test_conversation_t512.py
