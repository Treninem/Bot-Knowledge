name: RU temporal language completion I-J (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/temporal_language_20261111_context_delta_i.json'
      - 'staging/ru/temporal_language_20261111_context_delta_j.json'
      - 'scripts/test_temporal_language_20261111_i_j.py'
      - 'docs/TEMPORAL_LANGUAGE_I_J_2026_11_11.md'
      - '.github/workflows/temporal-language-completion-20261111.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/temporal_language_20261111_context_delta_i.json'
      - 'staging/ru/temporal_language_20261111_context_delta_j.json'
      - 'scripts/test_temporal_language_20261111_i_j.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "BK_TEMPORAL_COMPLETION_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate stages A-J
        run: python -m unittest scripts.test_temporal_language_20261111_i_j -v
