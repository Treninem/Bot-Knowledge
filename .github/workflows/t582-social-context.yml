name: T582-T585 social context exact-head
on:
  pull_request:
    paths:
      - "staging/ru/social_boundaries_t582_context_delta.json"
      - "staging/ru/social_boundaries_t583_context_delta.json"
      - "scripts/test_social_boundaries_t582_t583.py"
      - "staging/ru/social_boundaries_t584_context_delta.json"
      - "staging/ru/social_boundaries_t585_context_delta.json"
      - "scripts/test_social_boundaries_t584_t585.py"
      - ".github/workflows/t582-social-context.yml"
  push:
    branches: [main]
    paths:
      - "staging/ru/social_boundaries_t582_context_delta.json"
      - "staging/ru/social_boundaries_t583_context_delta.json"
      - "scripts/test_social_boundaries_t582_t583.py"
      - "staging/ru/social_boundaries_t584_context_delta.json"
      - "staging/ru/social_boundaries_t585_context_delta.json"
      - "scripts/test_social_boundaries_t584_t585.py"
      - ".github/workflows/t582-social-context.yml"
permissions:
  contents: read
jobs:
  verify-t582-t585:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout is the exact requested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registered packs and complete social-stage chain
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_social_boundaries_t580 scripts.test_social_boundaries_t581 scripts.test_social_boundaries_t582_t583 scripts.test_social_boundaries_t584_t585 -v
