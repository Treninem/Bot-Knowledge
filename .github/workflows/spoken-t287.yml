name: T287 spoken read-only continuation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-t287:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout against full exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registered SHA and schemas
        run: python scripts/validate_pack.py
      - name: Validate entire T287 chain and negative selection tests
        run: python -m unittest scripts.test_spoken_delta_t287 -q
