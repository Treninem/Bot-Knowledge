name: T600-T601 group pragmatics exact-head
on:
  pull_request:
    paths:
      - "staging/ru/group_pragmatics_t600_context_pool.json"
      - "staging/ru/group_pragmatics_t601_context_delta.json"
      - "scripts/test_group_pragmatics_t600_t601.py"
      - ".github/workflows/t600-group-pragmatics.yml"
  push:
    branches: [main]
    paths:
      - "staging/ru/group_pragmatics_t600_context_pool.json"
      - "staging/ru/group_pragmatics_t601_context_delta.json"
      - "scripts/test_group_pragmatics_t600_t601.py"
      - ".github/workflows/t600-group-pragmatics.yml"
permissions:
  contents: read
jobs:
  verify-t600-t601:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check actual checkout head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registered source and staged replies
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_group_pragmatics_t600_t601 -v
