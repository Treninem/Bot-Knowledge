name: Structured RU N81-N106 read-only exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261113_delta_n.json'
      - 'scripts/test_structured_n_20261113.py'
      - 'docs/STRUCTURED_N_2026_11_13.md'
      - '.github/workflows/structured-n-20261113.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report staged N bytes and SHA-256
        run: |
          wc -c staging/ru/structured_information_20261113_delta_n.json
          sha256sum staging/ru/structured_information_20261113_delta_n.json
      - name: Validate packs and L/M/N staging
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_l_20261111 scripts.test_structured_m_20261112 scripts.test_structured_n_20261113 -v
          python -O -m unittest scripts.test_structured_n_20261113 -v
