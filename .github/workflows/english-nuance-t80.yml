name: English nuance T80
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  en-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        run: git rev-parse HEAD
      - name: Validate manifest and QA
        run: python scripts/validate_pack.py
      - name: Test T80 English nuance pack
        run: python -m unittest scripts.test_english_conversation_nuance_t80 -q
