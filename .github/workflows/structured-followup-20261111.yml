name: Structured RU E-F 228 original context replies exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/structured_information_20261111_delta_e.json'
      - 'staging/ru/structured_information_20261111_delta_f.json'
      - 'scripts/test_structured_followup_20261111.py'
      - 'docs/STRUCTURED_FOLLOWUP_2026_11_11.md'
      - '.github/workflows/structured-followup-20261111.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact PR head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered packs, all staged structured replies, context and dedup
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_structured_remainder_20261111 scripts.test_structured_followup_20261111 -v
