name: Bot-Knowledge quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'BK_QUALITY_CHECKOUT_SHA=%s\n' "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate language pack
        run: python scripts/validate_pack.py
      - name: Reviewed publisher contract
        run: python -m unittest scripts.test_trusted_publish_qa -q
      - name: Shared skills cache and live GitHub read benchmark
        run: python scripts/benchmark_shared_skills.py
      - name: Ten rounds of reusable communication playbooks
        run: python scripts/test_playbooks.py
      - name: T14 original conversation context, SHA and indexed lookup
        run: python -m scripts.test_social_dialogue_t14
      - name: T15 social dialogue context integrity and retrieval
        run: python -m scripts.test_social_dialogue_t15
      - name: New synthetic social dialogue retrieval and integrity
        run: python -m scripts.test_social_dialogue_t7
      - name: Ten rounds of synthetic context and integrity cases
        run: python scripts/test_context_cases.py
      - name: T19 distinct social contexts, integrity and local search
        run: python -m scripts.test_social_dialogue_t19
      - name: T24 social contexts, privacy, SHA and retrieval
        run: python -m scripts.test_social_dialogue_t24
      - name: T28 original social responses with scoped retrieval
        run: python -m scripts.test_social_dialogue_t28
      - name: T33 social natural contexts, integrity, privacy and retrieval
        run: python -m scripts.test_social_dialogue_t33
      - name: T35 contextual social replies, SHA, duplicates, safety and retrieval
        run: python -m scripts.test_social_dialogue_t35
      - name: T39 original contextual social replies and exact SHA
        run: python -m scripts.test_social_dialogue_t39
      - name: T40 natural synthetic social replies, scope, SHA and retrieval
        run: python -m scripts.test_social_dialogue_t40
      - name: T30 distinct context-scoped social responses and manifest integrity
        run: python -m scripts.test_social_dialogue_t30
      - name: T21 grounded natural social responses, SHA, privacy and retrieval
        run: python -m scripts.test_social_dialogue_t21
      - name: T17 natural social contexts and local retrieval
        run: python -m scripts.test_social_dialogue_t17
      - name: T16 natural help, contexts and indexed search
        run: python -m scripts.test_natural_help_t16
      - name: T20 English conversation, rule nuance and creative retrieval
        run: python -m scripts.test_english_dialogue_t20
      - name: T26 English meaning, contextual replies, integrity and retrieval
        run: python -m scripts.test_english_dialogue_t26
      - name: T32 English contexts, meanings, privacy and exact-head SHA
        run: python -m scripts.test_english_dialogue_t32
      - name: T37 English conversation, meaning, privacy and scoped retrieval
        run: python -m scripts.test_english_dialogue_t37
      - name: T23 English semantic contexts, privacy and bounded retrieval
        run: python -m scripts.test_english_dialogue_t23
      - name: T14 English natural dialogue and contextual search
        run: python -m scripts.test_english_dialogue_t14
      - name: Extended multilingual, moderation and local retrieval checks
        run: python scripts/test_extended_knowledge.py
      - name: Expression selection, integrity and policy tests
        run: python scripts/test_expression_choices.py
      - name: Privacy regression tests for learning candidates
        run: python scripts/test_candidate_privacy.py
      - name: Reviewed-skill manifest preflight, SHA and policy guards
        run: python scripts/test_preflight_skill_manifest.py
      - name: Offline reviewed-skill draft builder regression
        run: python scripts/test_build_skill_draft.py
      - name: Validate dynamic qa.v1 packages
        run: python scripts/validate_qa_v1.py
      - name: Universal dialogue qa.v1 alias retrieval and context boundaries
        run: python -m scripts.test_dialogue_help_expansion
      - name: T29 scoped natural clarification QA and search
        run: python -m scripts.test_dialogue_help_t29
      - name: T36 universal natural clarification questions and scoped search
        run: python -m scripts.test_dialogue_help_t36
      - name: ImPULS public qa.v1 help scope, hash and duplicate checks
        run: python -m unittest scripts.test_impuls_help_qa -q
      - name: T14 natural ImPULS help aliases, scope, integrity and retrieval
        run: python -m scripts.test_impuls_help_t14
      - name: T15 natural ImPULS feature comparisons, search and scope
        run: python -m scripts.test_impuls_help_t15
      - name: T18 ImPULS feature clarity and indexed paraphrases
        run: python -m scripts.test_impuls_help_t18
      - name: T25 source-scoped natural ImPULS FAQ, exact hash and retrieval
        run: python -m scripts.test_impuls_help_t25
      - name: T27 source-scoped practical ImPULS questions and natural replies
        run: python -m scripts.test_impuls_help_t27
      - name: T34 natural ImPULS help, schema, SHA and scoped retrieval
        run: python -m scripts.test_impuls_help_t34
      - name: T38 grounded ImPULS natural help, SHA and scoped lookup
        run: python -m scripts.test_impuls_help_t38
      - name: T41 source-grounded ImPULS natural help and audience isolation
        run: python -m scripts.test_impuls_help_t41
      - name: T31 grounded family and games help, source and search isolation
        run: python -m scripts.test_impuls_help_t31
      - name: T22 natural ImPULS help, exact SHA, aliases and audience isolation
        run: python -m scripts.test_impuls_help_t22
      - name: T17 natural ImPULS help guidance and search isolation
        run: python -m scripts.test_impuls_help_t17
      - name: ImPULS help gap paraphrases and audience isolation
        run: |
          python -m scripts.test_impuls_help_gaps
          python -O -m scripts.test_impuls_help_gaps
      - name: Trusted qa.v1 publisher input guards
        run: python scripts/test_trusted_publish_qa.py
      - name: Trusted qa.v1 completion offline safety tests
        run: python scripts/test_complete_trusted_qa_pr.py
      - name: Contrastive pragmatics matching and abstention checks
        run: python scripts/test_pragmatics.py
      - name: Contrast phrase index and scope checks
        run: python scripts/test_pragmatic_search.py
      - name: Conservative bilingual dialogue routing and anti-repeat tests
        run: python scripts/test_conversation_router.py
      - name: Index and scope checks for all bilingual dialogue triggers
        run: python scripts/test_dialogue_search.py
      - name: Verified snapshot SHA and bounded per-instance lookup cache lifecycle
        run: python scripts/test_search_cache.py
      - name: Execute contextual RU-EN referent resolution and failure-safe tests
        run: python scripts/test_referent_resolution.py
      - name: Safe RU/EN typo matching and ephemeral dialogue session tests
        run: python scripts/test_safe_typos.py
      - name: Exact RU/EN meaning preservation and wrong-meaning contrasts
        run: python scripts/test_paraphrase_meaning.py
      - name: Verify 56 bilingual confirmed-focus scenarios, expiry and isolation
        run: python scripts/test_turn_focus.py
      - name: Bilingual clarification boundary integrity tests
        run: python scripts/test_clarification_boundaries.py
      - name: Validate bilingual semantic nuance and 10 rounds of word choice
        run: python scripts/test_word_nuances.py
      - name: Conservative bilingual clarification lookup and abstention
        run: python scripts/test_choose_clarification.py
      - name: Bilingual ephemeral style preferences, isolation and 10 rounds
        run: python scripts/test_style_preferences.py
      - name: SHA-checked RU/EN one-reply and session style scopes (10 rounds)
        run: python scripts/test_scoped_style.py
      - name: Conservative RU/EN numeric constraint repair and 48 scenario regressions
        run: python scripts/test_numeric_repair.py

      - name: Bilingual compositional style grammar, unknown variants and quote guards
        run: python scripts/test_composable_style.py
      - name: Block quoted RU/EN style requests and test 48 negative contexts
        run: python scripts/test_style_boundaries.py
      - name: Offline bilingual lexical corrections, 64 cases and refusal guards
        run: python scripts/test_lexical_repair.py
      - name: Bilingual discourse relations, 30 original cases and 90 register variants
        run: python scripts/test_discourse_links.py
      - name: Context-grounded RU/EN short replies and short-token retrieval
        run: python scripts/test_short_turns.py
