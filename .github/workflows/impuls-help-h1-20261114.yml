permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head without persisting token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checked-out head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate registered packs and H1 stage
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h1_20261114.py
          python -O -B scripts/test_impuls_help_h1_20261114.py
