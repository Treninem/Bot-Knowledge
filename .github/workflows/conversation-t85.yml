name: Conversation precision T85 exact-head
on:
  push:
    branches: [main]
    paths:
      - 'packs/ru/conversation_precision_qa.json'
      - 'manifest.json'
      - 'scripts/test_conversation_precision_t85.py'
      - '.github/workflows/conversation-t85.yml'
  pull_request:
    paths:
      - 'packs/ru/conversation_precision_qa.json'
      - 'manifest.json'
      - 'scripts/test_conversation_precision_t85.py'
      - '.github/workflows/conversation-t85.yml'
permissions:
  contents: read
jobs:
  precision-t85:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate manifest and all packages
        run: python scripts/validate_pack.py
      - name: Verify T85 content, privacy and local lookup
        run: python -m scripts.test_conversation_precision_t85
