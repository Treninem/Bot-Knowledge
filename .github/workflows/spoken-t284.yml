name: T284 spoken context inventory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-t284:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered pack hashes
        run: python scripts/validate_pack.py
      - name: Validate T284 staged parent chain and read-only selection
        run: python -m unittest scripts.test_spoken_delta_t284 -q
