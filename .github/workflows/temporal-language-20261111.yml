name: RU temporal-language staged read-only QA
on:
  pull_request:
    paths:
      - 'staging/ru/temporal_language_20261111_*'
      - 'scripts/test_temporal_language_20261111.py'
      - 'docs/TEMPORAL_LANGUAGE_2026_11_11.md'
      - '.github/workflows/temporal-language-20261111.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/temporal_language_20261111_*'
      - 'scripts/test_temporal_language_20261111.py'
      - 'docs/TEMPORAL_LANGUAGE_2026_11_11.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "BK_TEMPORAL_CHECKOUT_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run temporal-language regression
        run: python -m unittest scripts.test_temporal_language_20261111 -v
