name: ImPULS H101-H102 exact-head staged QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h101_20261116.json'
      - 'staging/ru/impuls_help_context_h102_20261116.json'
      - 'scripts/test_impuls_help_h101_20261116.py'
      - 'scripts/test_impuls_help_h102_20261116.py'
      - 'docs/IMPULS_HELP_H101_2026_11_16.md'
      - 'docs/IMPULS_HELP_H102_2026_11_16.md'
      - '.github/workflows/impuls-help-h101-20261116.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate staged candidates and published packs
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h100_20261116.py
          python -O -B scripts/test_impuls_help_h100_20261116.py
          python -B scripts/test_impuls_help_h101_20261116.py
          python -O -B scripts/test_impuls_help_h101_20261116.py
          python -B scripts/test_impuls_help_h102_20261116.py
          python -O -B scripts/test_impuls_help_h102_20261116.py
      - name: Verify actual bytes
        run: sha256sum staging/ru/impuls_help_context_h101_20261116.json staging/ru/impuls_help_context_h102_20261116.json
