name: T534 practical dialogue exact-head read-only
on:
  pull_request:
    paths:
      - "staging/ru/practical_dialogue_t534_context_pool.json"
      - "scripts/test_practical_dialogue_t534.py"
      - "docs/PRACTICAL_DIALOGUE_T534_2026_11_10.md"
      - ".github/workflows/t534-practical-dialogue.yml"
      - "packs/ru/dialogue.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/practical_dialogue_t534_context_pool.json"
      - "scripts/test_practical_dialogue_t534.py"
      - ".github/workflows/t534-practical-dialogue.yml"
permissions:
  contents: read
jobs:
  verify-t534:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual exact head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source and staged contexts
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_practical_dialogue_t534 -v
