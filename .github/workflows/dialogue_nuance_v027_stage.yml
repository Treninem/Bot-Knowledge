name: Dialogue nuance v027 staged RU contexts exact-head
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registered manifest validation
        run: python scripts/validate_pack.py
      - name: New and historical context stage validation
        run: |
          python -m unittest scripts.test_dialogue_nuance_v027_stage -q
          python -O -m unittest scripts.test_dialogue_nuance_v027_stage -q
