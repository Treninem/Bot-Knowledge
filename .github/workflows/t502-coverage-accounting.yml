name: Bot-Knowledge T502 cross-stage coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  t502-coverage-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'T502_EXACT_HEAD=%s\n' "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged pack
        run: python scripts/validate_pack.py
      - name: Check cross-stage coverage accounting
        run: |
          python -m unittest scripts.test_coverage_intent_report -q
          python scripts/coverage_intent_report.py
