name: Trusted qa.v1 publisher exact-head

on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'packs/ru/**'
      - 'scripts/trusted_publish_qa.py'
      - 'scripts/complete_trusted_qa_pr.py'
      - 'scripts/test_trusted_publish_qa.py'
      - 'scripts/test_complete_trusted_qa_pr.py'
      - 'scripts/validate_qa_v1.py'
      - '.github/workflows/trusted-qa-publisher.yml'
      - 'docs/TRUSTED_QA_PUBLISH_COMPLETION.md'

permissions:
  contents: read

jobs:
  qa-publisher-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact PR head is checked out
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate manifest hashes and qa.v1 contracts
        run: |
          python scripts/validate_pack.py
          python scripts/validate_qa_v1.py
      - name: Test trusted publisher and finalization guard offline
        run: |
          python scripts/test_trusted_publish_qa.py
          python scripts/test_complete_trusted_qa_pr.py
