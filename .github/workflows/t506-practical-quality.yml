name: Bot-Knowledge T506 practical candidate quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  t506-practical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and staged candidate safety
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_practical_turns_t503 scripts.test_practical_turns_t504 scripts.test_practical_turns_t505 scripts.test_practical_turns_t506 -q
