name: Bot-Knowledge T514 contextual conversation continuation
on:
  pull_request:
    paths:
      - 'staging/ru/conversation_t514_context_pool.json'
      - 'scripts/test_conversation_t514.py'
      - 'docs/CONVERSATION_T514_2026_11_09.md'
      - '.github/workflows/t514-conversation.yml'
      - 'packs/ru/dialogue.json'
      - 'manifest.json'
permissions:
  contents: read
jobs:
  t514:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head without credential persistence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert actual checkout SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Check T514 cross-stage content and source SHA
        run: python scripts/test_conversation_t514.py
