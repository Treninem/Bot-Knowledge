name: T341 T342 RU contextual answers exact-head
on:
  pull_request:
    paths:
      - 'staging/ru/colloquial_t341_context_pool.json'
      - 'staging/ru/practical_t342_context_pool.json'
      - 'scripts/context_t341_t342.py'
      - 'scripts/test_context_t341_t342.py'
      - 'docs/CONTEXT_CONTINUATION_T341_T342_2026_11_07.md'
      - '.github/workflows/context-t341-t342.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/colloquial_t341_context_pool.json'
      - 'staging/ru/practical_t342_context_pool.json'
      - 'scripts/context_t341_t342.py'
      - 'scripts/test_context_t341_t342.py'
      - 'docs/CONTEXT_CONTINUATION_T341_T342_2026_11_07.md'
      - '.github/workflows/context-t341-t342.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registered source packages
        run: python scripts/validate_pack.py
      - name: Historical stage validation and privacy
        run: python -m unittest scripts.test_context_t341_t342 -q
      - name: Read-only stage validation
        run: python -m scripts.context_t341_t342
