name: T308 recovery additional contexts (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/practical_t308_context_pool.json'
      - 'scripts/practical_t308.py'
      - 'scripts/test_practical_t308.py'
      - '.github/workflows/practical-t308.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/practical_t308_context_pool.json'
      - 'scripts/practical_t308.py'
      - 'scripts/test_practical_t308.py'
      - '.github/workflows/practical-t308.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate registered pack hashes
        run: python scripts/validate_pack.py
      - name: Test T306 and T308
        run: python -m unittest scripts.test_practical_t306 scripts.test_practical_t308 -q
