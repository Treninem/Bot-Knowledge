name: T311 T312 context replies exact-head
on:
  pull_request:
    paths:
      - 'staging/ru/colloquial_t311_context_pool.json'
      - 'staging/ru/practical_t312_context_pool.json'
      - 'scripts/context_t311_t312.py'
      - 'scripts/test_context_t311_t312.py'
      - 'docs/CONTEXT_CONTINUATION_T311_T312_2026_11_07.md'
      - '.github/workflows/context-t311-t312.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/colloquial_t311_context_pool.json'
      - 'staging/ru/practical_t312_context_pool.json'
      - 'scripts/context_t311_t312.py'
      - 'scripts/test_context_t311_t312.py'
      - 'docs/CONTEXT_CONTINUATION_T311_T312_2026_11_07.md'
      - '.github/workflows/context-t311-t312.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert actual exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate manifest and registered hashes
        run: python scripts/validate_pack.py
      - name: Test 138 scoped choices and parent SHA
        run: python -m unittest scripts.test_context_t311_t312 -q
      - name: Validate both context pools
        run: python -m scripts.context_t311_t312
