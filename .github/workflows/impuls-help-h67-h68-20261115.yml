name: ImPULS H67-H68 exact-head staged QA
on:
  pull_request:
    paths:
      - 'staging/ru/impuls_help_context_h67_20261115.json'
      - 'staging/ru/impuls_help_context_h68_20261115.json'
      - 'scripts/test_impuls_help_h67_h68_20261115.py'
      - 'docs/IMPULS_HELP_H67_H68_2026_11_15.md'
      - '.github/workflows/impuls-help-h67-h68-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate packs and staged answers
        run: |
          python -B scripts/validate_pack.py
          python -B scripts/test_impuls_help_h66_20261115.py
          python -O -B scripts/test_impuls_help_h66_20261115.py
          python -B scripts/test_impuls_help_h67_h68_20261115.py
          python -O -B scripts/test_impuls_help_h67_h68_20261115.py
      - name: File SHA-256
        run: |
          sha256sum staging/ru/impuls_help_context_h67_20261115.json
          sha256sum staging/ru/impuls_help_context_h68_20261115.json
