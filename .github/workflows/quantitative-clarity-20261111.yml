name: RU quantitative clarity staging exact-head QA
on:
  pull_request:
    paths:
      - 'staging/ru/quantitative_clarity_20261111_*'
      - 'scripts/test_quantitative_clarity_20261111.py'
      - 'scripts/test_quantitative_clarity_extension_20261111.py'
      - 'docs/QUANTITATIVE_CLARITY_2026_11_11.md'
      - '.github/workflows/quantitative-clarity-20261111.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/quantitative_clarity_20261111_*'
      - 'scripts/test_quantitative_clarity_20261111.py'
      - 'docs/QUANTITATIVE_CLARITY_2026_11_11.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact actual checkout head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "BK_QUANT_CHECKOUT_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate staging and source boundaries
        run: python -m unittest scripts.test_quantitative_clarity_20261111 scripts.test_quantitative_clarity_extension_20261111 -v
