name: T497 social clarity (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/social_clarity_t497_context_pool.json'
      - 'scripts/test_social_clarity_t497.py'
      - '.github/workflows/t497-context-quality.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/social_clarity_t497_context_pool.json'
      - 'scripts/test_social_clarity_t497.py'
      - '.github/workflows/t497-context-quality.yml'
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify stage T497 data against full history
        run: python -m unittest scripts.test_social_clarity_t497 -q
