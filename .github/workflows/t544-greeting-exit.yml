name: T544 greetings scope exact-head
on:
  pull_request:
    paths:
      - "staging/ru/greeting_exit_t544_context_pool.json"
      - "scripts/test_greeting_exit_t544.py"
      - "docs/GREETING_EXIT_T544_2026_11_10.md"
      - ".github/workflows/t544-greeting-exit.yml"
      - "packs/ru/social_dialogues.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/greeting_exit_t544_context_pool.json"
      - "scripts/test_greeting_exit_t544.py"
      - ".github/workflows/t544-greeting-exit.yml"
permissions:
  contents: read
jobs:
  verify-t544:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate registered packs and staged replies
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_greeting_exit_t544
