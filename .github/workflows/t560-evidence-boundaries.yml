name: T560 evidence-boundaries read-only exact-head
on:
  pull_request:
    paths:
      - "staging/ru/evidence_boundaries_t560_context_pool.json"
      - "scripts/test_evidence_boundaries_t560.py"
      - "docs/EVIDENCE_BOUNDARIES_T560_2026_11_10.md"
      - ".github/workflows/t560-evidence-boundaries.yml"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/evidence_boundaries_t560_context_pool.json"
      - "scripts/test_evidence_boundaries_t560.py"
      - ".github/workflows/t560-evidence-boundaries.yml"
permissions:
  contents: read
jobs:
  verify-t560:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registered snapshot and scoped evidence replies
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_evidence_boundaries_t560 -v
