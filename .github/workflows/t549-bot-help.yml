name: T549 read-only scoped help exact-head
on:
  pull_request:
    paths:
      - "staging/ru/bot_help_t549_context_pool.json"
      - "scripts/test_bot_help_t549.py"
      - "docs/BOT_HELP_T549_2026_11_10.md"
      - ".github/workflows/t549-bot-help.yml"
      - "packs/ru/social_dialogues.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/bot_help_t549_context_pool.json"
      - "scripts/test_bot_help_t549.py"
      - ".github/workflows/t549-bot-help.yml"
permissions:
  contents: read
jobs:
  verify-t549:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate registered snapshot and candidate conditions
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_bot_help_t549 -v
