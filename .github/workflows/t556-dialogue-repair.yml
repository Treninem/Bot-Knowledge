name: T556 read-only dialogue repair delta exact-head
on:
  pull_request:
    paths:
      - "staging/ru/dialogue_repair_t556_context_delta.json"
      - "scripts/test_dialogue_repair_t556.py"
      - "docs/DIALOGUE_REPAIR_T556_2026_11_10.md"
      - ".github/workflows/t556-dialogue-repair.yml"
      - "staging/ru/dialogue_repair_t554_context_pool.json"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/dialogue_repair_t556_context_delta.json"
      - "scripts/test_dialogue_repair_t556.py"
      - ".github/workflows/t556-dialogue-repair.yml"
permissions:
  contents: read
jobs:
  verify-t556:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source and full 440 scoped examples
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_dialogue_repair_t554 scripts.test_dialogue_repair_t556 -v
