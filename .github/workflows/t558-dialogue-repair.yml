name: T558 read-only dialogue repairs exact-head
on:
  pull_request:
    paths:
      - "staging/ru/dialogue_repair_t558_context_delta.json"
      - "scripts/test_dialogue_repair_t558.py"
      - "docs/DIALOGUE_REPAIR_T558_2026_11_10.md"
      - ".github/workflows/t558-dialogue-repair.yml"
      - "manifest.json"
  push:
    branches: [main]
    paths:
      - "staging/ru/dialogue_repair_t558_context_delta.json"
      - "scripts/test_dialogue_repair_t558.py"
      - ".github/workflows/t558-dialogue-repair.yml"
permissions:
  contents: read
jobs:
  verify-t558:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all 800 source-pinned original replies
        run: |
          python scripts/validate_pack.py
          python -m unittest scripts.test_dialogue_repair_t554 scripts.test_dialogue_repair_t555 scripts.test_dialogue_repair_t556 scripts.test_dialogue_repair_t557 scripts.test_dialogue_repair_t558 -v
