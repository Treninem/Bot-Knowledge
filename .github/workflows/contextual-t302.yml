name: T302 Russian scoped context validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-t302:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm checked-out exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registered source manifest
        run: python scripts/validate_pack.py
      - name: Validate 136 new scoped replies and all ancestors
        run: python -m unittest scripts.test_context_overlay_t302 -q
