name: T307 colloquial RU additional contexts (read-only)
on:
  pull_request:
    paths:
      - 'staging/ru/colloquial_t307_context_pool.json'
      - 'scripts/colloquial_t307.py'
      - 'scripts/test_colloquial_t307.py'
      - '.github/workflows/colloquial-t307.yml'
  push:
    branches: [main]
    paths:
      - 'staging/ru/colloquial_t307_context_pool.json'
      - 'scripts/colloquial_t307.py'
      - 'scripts/test_colloquial_t307.py'
      - '.github/workflows/colloquial-t307.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check manifest hash
        run: python scripts/validate_pack.py
      - name: Test T305 and T307
        run: python -m unittest scripts.test_colloquial_t305 scripts.test_colloquial_t307 -q
